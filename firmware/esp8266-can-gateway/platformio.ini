[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 921600
monitor_filters = time, esp8266_exception_decoder
build_flags =
    -O2
    -Wall
    -Wextra
    -Werror=return-type
    -D NO_GLOBAL_HTTPUPDATE
    -D WEBSOCKETS_NETWORK_TYPE=NETWORK_ESP8266
lib_deps =
    links2004/WebSockets @ ^2.4.1
test_filter = test_protocol

[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = no
