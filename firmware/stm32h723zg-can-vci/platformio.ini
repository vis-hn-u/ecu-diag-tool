[platformio]
default_envs = nucleo_h723zg

[env:nucleo_h723zg]
platform = ststm32
board = nucleo_h723zg
framework = arduino
monitor_speed = 921600
upload_protocol = stlink

build_flags = 
    -D HSE_VALUE=25000000UL
    -D USBCON
    -D USBD_USE_CDC
    -D ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -O3
    -Wall
